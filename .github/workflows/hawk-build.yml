name: Build Hawk APK (Cloud)

on:
  push:
    branches:
      - hawk
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  EAS_CLI_VERSION: 24.4.2

concurrency:
  group: hawk-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK on EAS
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Configure EAS CLI install scripts
        run: |
          eas_cli_dir="$RUNNER_TEMP/eas-cli/$EAS_CLI_VERSION/$(node -p 'require("node:os").arch()')"
          mkdir -p "$eas_cli_dir"
          pnpm --dir "$eas_cli_dir" config set --location=project --json allowBuilds '{"dtrace-provider": false, "protobufjs": false}'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android on EAS and wait
        run: eas build --platform android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/android-build.json"

      - name: Download APK and verify
        env:
          RELEASE_DATE: ${{ github.run_number }}
        run: |
          build_json="$RUNNER_TEMP/android-build.json"
          jq -e 'length == 1 and .[0].status == "FINISHED" and .[0].platform == "ANDROID"' "$build_json"
          apk_url="$(jq -er '.[0].artifacts.applicationArchiveUrl' "$build_json")"
          version="$(jq -r '.expo.version' app.json)"
          artifact_dir="$RUNNER_TEMP/hawk-apk"
          mkdir -p "$artifact_dir"
          apk_name="hawk-ai-${version}-run${RELEASE_DATE}-android.apk"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 \
            "$apk_url" --output "$artifact_dir/$apk_name"
          unzip -tq "$artifact_dir/$apk_name"
          unzip -Z1 "$artifact_dir/$apk_name" | grep -x 'AndroidManifest.xml'
          echo "APK_SIZE=$(du -h "$artifact_dir/$apk_name" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "### Hawk APK 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "下载下方 Artifacts 中的 hawk-apk 即可" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawk-apk
          path: ${{ runner.temp }}/hawk-apk/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
